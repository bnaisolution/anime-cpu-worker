name: Start Anime CPU Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anime-cpu-worker
  cancel-in-progress: false

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto fonts-deva

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Validate Worker Secret
        env:
          WORKER_JOB_TOKEN_SECRET: ${{ secrets.WORKER_JOB_TOKEN_SECRET }}
        run: |
          if [ -z "$WORKER_JOB_TOKEN_SECRET" ]; then
            echo "::error::WORKER_JOB_TOKEN_SECRET is missing. Add it to repository Actions secrets."
            exit 1
          fi

      - name: Run Pull Worker
        env:
          ANIME_BACKEND_URL: https://api.bnai.dpdns.org
          WORKER_SERVICE_SECRET: ${{ secrets.WORKER_JOB_TOKEN_SECRET }}
          WORKER_JOB_TOKEN_SECRET: ${{ secrets.WORKER_JOB_TOKEN_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_STORAGE_CHAT_ID: ${{ secrets.TELEGRAM_STORAGE_CHAT_ID }}
          SVARA_ENGINE_MODE: FAST_CPU_VITS
          WORKER_ID: gh-${{ github.run_id }}
          WORKER_IDLE_EXIT_SECONDS: "1800"
          WORKER_MAX_LIFETIME_SECONDS: "21000"
        run: python worker_poll.py
